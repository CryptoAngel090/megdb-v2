                      - generic [ref=e298]: Christy Lemire
                  - generic "Is it wrong to root for the volcano?" [ref=e299]
            - listitem [ref=e300]:
              - button "Open Review by Chicago Reader" [ref=e301] [cursor=pointer]:
                - generic [ref=e303]:
