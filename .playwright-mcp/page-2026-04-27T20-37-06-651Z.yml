                    - img [ref=e305]
                    - generic [ref=e307]:
                      - generic "Chicago Reader" [ref=e308]
                      - generic [ref=e309]: Drew Hunt
                  - generic "Narrative has never been Anderson's strength; the story here is a corny overhaul of James Cameron's already-corny Titanic." [ref=e310]
            - listitem [ref=e311]:
              - button "Open Review by Grantland" [ref=e312] [cursor=pointer]:
                - generic [ref=e314]:
                  - generic [ref=e315]:
                    - img [ref=e316]
                    - generic [ref=e318]:
                      - generic "Grantland" [ref=e319]
                      - generic [ref=e320]: Wesley Morris
                  - generic "No matter how much lava is afoot, there's always time to impale one more person with a sword." [ref=e321]
            - listitem [ref=e322]:
              - button "Open Review by Film Comment Magazine" [ref=e323] [cursor=pointer]:
                - generic [ref=e325]:
                  - generic [ref=e326]:
                    - img [ref=e327]
                    - generic [ref=e330]:
                      - generic "Film Comment Magazine" [ref=e331]
                      - generic [ref=e332]: R. Emmet Sweeney
                  - generic "The closing images-of a self-annihilating, all-consuming passion that will be preserved for centuries-[obliterate] the line between the ridiculous and the sublime." [ref=e333]
            - listitem [ref=e334]:
              - button "Open Review by Shockya.com" [ref=e335] [cursor=pointer]:
                - generic [ref=e337]:
                  - generic [ref=e338]:
                    - img [ref=e339]
                    - generic [ref=e341]:
                      - generic "Shockya.com" [ref=e342]
                      - generic [ref=e343]: Perri Nemiroff
                  - generic "If you were hoping 'Pompeii' would ditch the lava in exchange for nonsensical political and romantic melodrama, Paul W.S. Anderson's latest is for you - and probably only you." [ref=e344]
            - listitem [ref=e345]:
              - button "Open Review by New York Magazine/Vulture" [ref=e346] [cursor=pointer]:
                - generic [ref=e348]:
                  - generic [ref=e349]:
                    - img [ref=e350]
                    - generic [ref=e353]:
                      - generic "New York Magazine/Vulture" [ref=e354]
                      - generic [ref=e355]: Bilge Ebiri
                  - generic "More fun than any civilization's fiery extinction should ever be, Paul W.S. Anderson's Pompeii 3-D is gloriously exciting kitsch - a poor man's Titanic crossed with an even poorer man's Gladiator." [ref=e356]
            - listitem [ref=e357]:
              - button "Open Review by Entertainment Weekly" [ref=e358] [cursor=pointer]:
                - generic [ref=e360]:
                  - generic [ref=e361]:
                    - img [ref=e362]
                    - generic [ref=e364]:
                      - generic "Entertainment Weekly" [ref=e365]
                      - generic [ref=e366]: Owen Gleiberman
                  - 'generic "Pompeii, the new historical-kitsch disaster movie, raises the question: Is there something about ancient classical settings that inspires actors to act badly?" [ref=e367]'
            - listitem [ref=e368]:
              - button "Open Review by CinemaBlend" [ref=e369] [cursor=pointer]:
                - generic [ref=e371]:
                  - generic [ref=e372]:
                    - img [ref=e373]
                    - generic [ref=e375]:
                      - generic "CinemaBlend" [ref=e376]
                      - generic [ref=e377]: Kristy Puchko
                  - generic "A convoluted yet clichéd love story with some ill-executed gladiator antics and a barrage of bad CG." [ref=e378]
            - listitem [ref=e379]:
              - button "Open Review by RogerEbert.com" [ref=e380] [cursor=pointer]:
                - generic [ref=e382]:
                  - generic [ref=e383]:
                    - img [ref=e384]
                    - generic [ref=e387]:
                      - generic "RogerEbert.com" [ref=e388]
                      - generic [ref=e389]: Glenn Kenny
                  - generic "The action scenes are choice, and once the clouds of ash and shooting fire and churning seas start up, \"Pompeii\" achieves a momentum that most sensationalist studio fare can't touch." [ref=e390]
            - listitem [ref=e391]:
              - button "Open Review by AV Club" [ref=e392] [cursor=pointer]:
                - generic [ref=e394]:
                  - generic [ref=e395]:
                    - img [ref=e396]
                    - generic [ref=e399]:
                      - generic "AV Club" [ref=e400]
                      - generic [ref=e401]: Ignatiy Vishnevetsky
                  - generic "Like its director's horror hybrids, Pompeii values self-determination over survival, which makes for better, brisker, less convoluted genre storytelling." [ref=e402]
            - listitem [ref=e403]:
              - button "Open Review by Fort Worth Star-Telegram/DFW.com" [ref=e404] [cursor=pointer]:
                - generic [ref=e406]:
                  - generic [ref=e407]:
                    - img [ref=e408]
                    - generic [ref=e410]:
                      - generic "Fort Worth Star-Telegram/DFW.com" [ref=e411]
                      - generic [ref=e412]: Cary Darling
                  - generic "Pompeii has as much to do with realism and history as the average gas station has with gourmet cuisine and fine dining. If you're hankering for something substantive, you'll leave hungry." [ref=e413]
            - listitem [ref=e414]:
              - button "Open Review by NPR" [ref=e415] [cursor=pointer]:
                - generic [ref=e417]:
                  - generic [ref=e418]:
                    - img [ref=e419]
                    - generic [ref=e421]:
                      - generic "NPR" [ref=e422]
                      - generic [ref=e423]: Ian Buckwalter
                  - generic "If there were a hint of a sense of play or humor in the filmmaking, beyond a briefly amusing moment of comeuppance for a foppish slaveowner, Pompeii might be a fun February diversion instead of a dull, eye-rolling slog." [ref=e424]
            - listitem [ref=e425]:
              - button "Open Review by Movie Mom" [ref=e426] [cursor=pointer]:
                - generic [ref=e428]:
                  - generic [ref=e429]:
                    - img [ref=e430]
                    - generic [ref=e433]:
                      - generic "Movie Mom" [ref=e434]
                      - generic [ref=e435]: Nell Minow
                  - generic "The special effects, especially in 3D, are impressive. But the movie is dragged down by its cheesy storyline." [ref=e436]
            - listitem [ref=e437]:
              - button "Open Review by USA Today" [ref=e438] [cursor=pointer]:
                - generic [ref=e440]:
                  - generic [ref=e441]:
                    - img [ref=e442]
                    - generic [ref=e444]:
                      - generic "USA Today" [ref=e445]
                      - generic [ref=e446]: Claudia Puig
                  - generic "Pompeii is a Titanic wannabe with a romance between a rich girl and a poor boy set against a natural disaster." [ref=e447]
            - listitem [ref=e448]:
              - button "Open Review by New York Times" [ref=e449] [cursor=pointer]:
                - generic [ref=e451]:
                  - generic [ref=e452]:
                    - img [ref=e453]
                    - generic [ref=e455]:
                      - generic "New York Times" [ref=e456]
                      - generic [ref=e457]: Miriam Bale
                  - generic "In \"Pompeii,\" Mr. Anderson's latest 3-D extravaganza, and his first film without Ms. Jovovich since 2008, he seems to be without visual focus." [ref=e458]
            - listitem [ref=e459]:
              - button "Open Review by Washington Post" [ref=e460] [cursor=pointer]:
                - generic [ref=e462]:
                  - generic [ref=e463]:
                    - img [ref=e464]
                    - generic [ref=e466]:
                      - generic "Washington Post" [ref=e467]
                      - generic [ref=e468]: Stephanie Merry
                  - 'generic "Harington transformed his body for the role, but here''s the real disaster: His startlingly defined six-pack abs are the most memorable part of his character." [ref=e469]'
            - listitem [ref=e470]:
              - button "Open Review by Los Angeles Times" [ref=e471] [cursor=pointer]:
                - generic [ref=e473]:
